name: build-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" "platform-tools" || \
          "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed | head -30

      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/sp.jks" -alias sp \
            -storepass sp123456 -keypass sp123456 -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=ShizuPosed Build"
          {
            echo "storeFile=$GITHUB_WORKSPACE/sp.jks"
            echo "storePassword=sp123456"
            echo "keyAlias=sp"
            echo "keyPassword=sp123456"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleStandardRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShizuPosed-standard-release
          path: app/build/outputs/apk/standard/release/*.apk
